# Module-level configuration.
#
# There is deliberately no [module.mounts] block. Declaring any mount replaces
# *all* of Hugo's default mounts for this module, not only the one declared, so
# a block naming layouts and static was two of the seven defaults written out by
# hand — identical output, and a trap set for the day the module grows an i18n/,
# data/ or assets/ directory and finds it silently unmounted. Measured: removing
# the block builds the exampleSite to a byte-identical file list. The defaults
# already cover everything here.
#
# What does live here: the AEO output formats. Theme/component config may define
# [outputFormats] and [mediaTypes]; Hugo merges them into the consuming site.
# [outputs] — which page kinds publish which formats — is the site's own decision
# and is deliberately NOT declared here: Hugo does not merge a component's
# [outputs] into a site's (verified — a theme declaring them publishes nothing),
# so a site that wants the files must say so itself. The README carries the exact
# block, and aeo-selfcheck.html says so at build time when it is missing.

# ── AEO output formats ──────────────────────────────────────────────────────
# llms.txt is an index an answer engine can read in one request instead of
# crawling: title, description, and every page as a linked list. llms-full.txt
# is the content behind those links, in markdown, in one file. The per-page
# Markdown output is the same content addressed the way a citation would want
# it — /posts/foo/index.md next to /posts/foo/.
#
# All three are Hugo output formats, which is what keeps this a template change
# rather than a dependency: no npm, no post-build step, no third-party JS.
#
# notAlternative on all three: head templates render a <link rel=alternate> for
# every AlternativeOutputFormats entry, which is right for the RSS feed and
# wrong for a plain-text index — it would advertise llms.txt to feed readers.
[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true
