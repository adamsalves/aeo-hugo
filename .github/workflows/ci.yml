# Builds the bundled exampleSite on every pull request, so a broken template
# never reaches main. Everything AEO fails silently — a Sitemap line pointing at
# a missing file still serves 200, a JSON-LD block with a typo still renders —
# so the build is the fixture and check_aeo.py is the review.
name: CI

on:
  pull_request:
  # After merge too: a PR that merged red slipped through review, and the
  # checkout in these steps reads layouts/ and scripts/ off the default branch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Both the module's declared minimum (theme.toml min_version) and the current
  # release: the minimum is the version whose embedded templates and API the
  # templates are written against, and "correcting" a template to a newer API
  # is exactly how that floor silently breaks.
  aeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        hugo-version: ['0.158.0', '0.163.3']
    env:
      HUGO_VERSION: ${{ matrix.hugo-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Symlink the module as the theme
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/aeo-hugo

      # Build under a sub-path: a site published under one is the shape where a
      # rooted "/img/x.png" or a rel-permalink compared wrong renders fine under
      # a root baseURL and breaks the day it moves.
      - name: Build exampleSite
        run: |
          hugo --source exampleSite --gc --minify --panicOnWarning \
            --baseURL "https://example.com/aeo-hugo/"

      - name: Assert the AEO output
        run: |
          set -eo pipefail
          python3 scripts/check_aeo.py exampleSite/public
          # …and the one page that has to stay silent. The 404 is not in the
          # content tree, so a BreadcrumbList there describes a hierarchy that
          # does not contain it and a WebSite node invites a crawler to treat an
          # error as a document.
          if grep -qF 'application/ld+json' exampleSite/public/404.html; then
            echo "aeo: the 404 carries structured data"
            exit 1
          fi
          echo 'aeo: the 404 stays out of the graph'

      # The README table is what a consumer reads before deciding whether to
      # switch a group off. Crawlers listed there that the template never names
      # are a block that did not happen.
      - name: Assert the README names the crawlers the template does
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          tpl = pathlib.Path('layouts/robots.txt').read_text(encoding='utf-8')
          readme = pathlib.Path('README.md').read_text(encoding='utf-8')
          bad = []

          def slice_names(var):
              m = re.search(r'\$%s := slice(.*?)-\}\}' % var, tpl, re.S)
              if not m:
                  sys.exit('robots.txt no longer declares $%s' % var)
              return set(re.findall(r'"([^"]+)"', m.group(1)))

          def row_names(switch):
              m = re.search(r'^\|\s*`%s`\s*\|(.*?)\|' % switch, readme, re.M)
              if not m:
                  sys.exit('README has no table row for `%s`' % switch)
              return set(re.findall(r'`([^`]+)`', m.group(1)))

          for var, switch in (('answerEngines', 'allowAI'),
                              ('trainingCrawlers', 'allowTraining')):
              in_tpl, in_doc = slice_names(var), row_names(switch)
              for name in sorted(in_doc - in_tpl):
                  bad.append('%s: README lists %s, which the template does not send'
                             % (switch, name))
              for name in sorted(in_tpl - in_doc):
                  bad.append('%s: the template sends %s, which the README does not list'
                             % (switch, name))

          if bad:
              sys.exit('\n'.join('crawlers: ' + b for b in bad))
          print('crawlers: the README table and layouts/robots.txt name the same bots')
          PY

      # [outputs] is the half a consuming site has to write — Hugo does not merge
      # a component's — so the module has to keep working without it. A site that
      # never adds the block gets no llms.txt and no markdown twins, and that is
      # a quiet absence rather than a broken build or a dangling link. Unlike a
      # theme that ships [outputs], the module ships none at all, so even a deep
      # merge inherits nothing — which is what keeps it opt-in.
      - name: Assert the AEO outputs are opt-in, not required
        run: |
          set -eo pipefail
          for merge in none deep; do
            d="/tmp/aeo-nooutputs-$merge"
            rm -rf "$d"; mkdir -p "$d/themes" "$d/content/posts" "$d/layouts/_default"
            ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
            printf 'baseURL = "https://example.com/t/"\ntitle = "No outputs"\ntheme = "aeo-hugo"\nenableRobotsTXT = true\n%b' \
              "$( [ "$merge" = deep ] && printf '_merge = "deep"\n' || printf '' )" > "$d/hugo.toml"
            printf -- '---\ntitle: "P"\ndate: 2026-01-01\n---\nbody\n' > "$d/content/posts/p.md"
            # The module is a component, not a theme: it renders no HTML. The
            # fixture supplies the smallest possible layouts, wired like a
            # consuming site would wire them.
            printf '<!DOCTYPE html><html><head>{{ partial "aeo-head.html" . }}</head><body><main>{{ block "main" . }}{{ end }}</main></body></html>' > "$d/layouts/_default/baseof.html"
            printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/index.html"
            printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/_default/single.html"
            printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/_default/list.html"
            # --panicOnWarning, and that is the assertion: this fixture writes
            # no [params.aeo] and asks for no AEO output, so it has misconfigured
            # nothing and the module must not say a word. warnidf *raises* under
            # this flag, which is ordinary practice for a careful site, so a
            # warning about a legitimate choice is a build failure rather than a
            # note. Measured on terminal-mono, the theme this was extracted from:
            # warning here stopped 17 of its CI steps from building.
            HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
            for f in llms.txt llms-full.txt posts/p/index.md; do
              if [ -f "$d/public/$f" ]; then
                echo "aeo: $f was published without the site asking for it in [outputs] (merge=$merge)"
                exit 1
              fi
            done
            # …and the RSS feed the default [outputs] would have given it is still
            # there, which is what a site loses by restating the block wrong.
            if [ ! -f "$d/public/index.xml" ]; then
              echo 'aeo: the feed disappeared from a site that declared no [outputs]'
              exit 1
            fi
            # The structural checks still run, minus the two formats it did not ask for.
            python3 scripts/check_aeo.py "$d/public" --no-llms --no-markdown
          done
          echo 'aeo: without [outputs] the site builds, keeps its feed, and gets no half-written index'
          # The other half of the rule: a site that *did* write [params.aeo] has
          # said it wants this, and a switch that decided nothing is then worth a
          # word. Same fixture, one table added.
          d=/tmp/aeo-configured-no-outputs
          rm -rf "$d"; cp -r /tmp/aeo-nooutputs-none "$d"; rm -rf "$d/public"
          printf '[params.aeo]\n  allowTraining = false\n' >> "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          for id in aeo-no-llms aeo-no-markdown; do
            grep -qF "ignoreLogs = ['$id']" "$d.log" \
              || { echo "aeo: a site that configured [params.aeo] and no [outputs] did not get $id"; cat "$d.log"; exit 1; }
          done
          echo 'aeo: …and a site that configured AEO and publishes none of it is told so'

      # robots.txt reads [params.aeo] disallow and the build condition and acts
      # on both; the three AEO files must too, or the exclusion becomes a switch
      # that works against crawlers and not against the files written for them.
      # A path with `Disallow:` on it in robots.txt and its full body sitting in
      # llms-full.txt is not excluded.
      - name: Assert the AEO output honours disallow and the build condition
        run: |
          set -eo pipefail
          d=/tmp/aeo-gate
          rm -rf "$d"; mkdir -p "$d/themes" "$d/content/posts" "$d/layouts/_default"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/t/"
          title = "Gate"
          theme = "aeo-hugo"
          enableRobotsTXT = true
          [params.aeo]
            disallow = ["/posts/hidden/"]
            postSections = ["posts"]
          [outputs]
            home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
            page = ["HTML", "MARKDOWN"]
          TOML
          printf '<!DOCTYPE html><html><head>{{ partial "aeo-head.html" . }}</head><body><main>{{ block "main" . }}{{ end }}</main></body></html>' > "$d/layouts/_default/baseof.html"
          printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/index.html"
          printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/_default/single.html"
          printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/_default/list.html"
          printf -- '---\ntitle: "Hidden"\ndate: 2026-01-01\ntags: ["x"]\n---\nEXCLUDEDBODY\n' > "$d/content/posts/hidden.md"
          printf -- '---\ntitle: "Shown"\ndate: 2026-01-02\ntags: ["x"]\n---\nPUBLICBODY\n' > "$d/content/posts/shown.md"
          HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          hugo --source "$d" --gc --minify --environment development --destination "$d/preview" > "$d.prev.log" 2>&1 || { cat "$d.prev.log"; exit 1; }
          fail=0
          say() { echo "gate: $1"; fail=1; }
          # The excluded post: named nowhere, body nowhere, and its twin says so.
          grep -qF '/posts/hidden/' "$d/public/robots.txt" || say 'robots.txt did not disallow it — the fixture is wrong'
          grep -qF 'posts/hidden' "$d/public/llms.txt" && say 'llms.txt lists a path robots.txt disallows'
          grep -qF 'EXCLUDEDBODY' "$d/public/llms-full.txt" && say 'llms-full.txt carries the body of a disallowed post'
          grep -qF 'EXCLUDEDBODY' "$d/public/posts/hidden/index.md" && say 'the twin of a disallowed post carries its body'
          # …while the post beside it is untouched.
          grep -qF 'posts/shown' "$d/public/llms.txt" || say 'llms.txt dropped a post nothing excluded'
          grep -qF 'PUBLICBODY' "$d/public/llms-full.txt" || say 'llms-full.txt dropped a body nothing excluded'
          # A build that is not for indexing publishes the files and no content.
          grep -qF 'not for indexing' "$d/preview/llms.txt" || say 'the preview llms.txt does not say the build is not for indexing'
          grep -qF 'EXCLUDEDBODY' "$d/preview/llms-full.txt" && say 'the preview llms-full.txt carries a post body'
          # The twin's own body, not the excluded one's: the defect this guards
          # against is a preview twin carrying the body it names, and that body
          # is PUBLICBODY.
          grep -qF 'PUBLICBODY' "$d/preview/posts/shown/index.md" && say 'the preview twin carries its post body'
          grep -qF 'Disallow: /' "$d/preview/robots.txt" || say 'the preview robots.txt does not disallow everything'
          grep -qF 'noindex, nofollow' "$d/preview/index.html" || say 'the preview home has no noindex meta'
          [ "$fail" = 0 ] || exit 1
          # The manual greps watch what only this fixture has — the exclusion
          # and the preview switch — while the shared script reviews the
          # structure of the production build: the Sitemap file resolving, the
          # JSON-LD graph on every page, the llms links, the twins naming their
          # own pages. The preview skips llms.txt, whose non-indexing form is a
          # banner with no list in it, which is not what check_llms reads.
          python3 scripts/check_aeo.py "$d/public"
          python3 scripts/check_aeo.py "$d/preview" --not-indexable --no-llms
          echo 'aeo: disallow excludes a post from every AEO file, and a non-indexing build publishes none of the content'

      # The failure this module is most exposed to, and the one nothing else
      # catches: a site that imported it, configured it correctly, and publishes
      # none of it. `theme = ["your-theme", "aeo-hugo"]` is the wrong precedence
      # order, most themes ship a robots.txt, the left-most wins — and the site's
      # allowTraining and disallow then apply to a file that is never published.
      # Hugo is doing exactly what the array asks for, so only the module can say
      # this is wrong.
      - name: Assert the module reports itself unwired
        run: |
          set -eo pipefail
          d=/tmp/aeo-unwired
          rm -rf "$d"; mkdir -p "$d/themes/mytheme/layouts/_default" "$d/content/posts"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
          printf 'name = "My"\nlicense = "MIT"\n' > "$d/themes/mytheme/theme.toml"
          # What a real theme ships, and what beats the module's own.
          printf 'User-agent: *\nAllow: /\n' > "$d/themes/mytheme/layouts/robots.txt"
          printf '<!DOCTYPE html><html><head>{{ partial "aeo-head.html" . }}</head><body><main>{{ block "main" . }}{{ end }}</main></body></html>' > "$d/themes/mytheme/layouts/_default/baseof.html"
          for f in index.html _default/single.html _default/list.html; do
            mkdir -p "$(dirname "$d/themes/mytheme/layouts/$f")"
            printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/themes/mytheme/layouts/$f"
          done
          printf -- '---\ntitle: "P"\ndate: 2026-01-01\n---\nbody\n' > "$d/content/posts/p.md"
          write_config() {
            cat > "$d/hugo.toml" <<TOML
          baseURL = "https://example.com/"
          title = "Unwired"
          theme = ["mytheme", "aeo-hugo"]
          enableRobotsTXT = true
          [params.aeo]
            allowTraining = false
            disallow = ["/drafts/"]
          $1
          [outputs]
            home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
            page = ["HTML", "MARKDOWN"]
          TOML
          }
          write_config ""
          HUGO_ENV=production hugo --source "$d" --gc --destination "$d/public" > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          grep -qF "ignoreLogs = ['aeo-no-robots']" "$d.log" \
            || { echo 'aeo: another theme took robots.txt and the module said nothing'; cat "$d.log"; exit 1; }
          # …and the warning is telling the truth: the published file is the
          # theme's, so allowTraining = false decided nothing.
          grep -qF 'GPTBot' "$d/public/robots.txt" \
            && { echo 'aeo: the fixture is wrong — the module won after all'; exit 1; }
          # The opt-out has to hold under --panicOnWarning, which is the whole
          # reason it exists: a site that has read the warning and decided.
          write_config '  quiet = true'
          HUGO_ENV=production hugo --source "$d" --gc --panicOnWarning --destination "$d/quiet" > "$d.quiet.log" 2>&1 \
            || { echo 'aeo: [params.aeo] quiet = true did not silence the self-check'; cat "$d.quiet.log"; exit 1; }
          echo 'aeo: an unwired site is told so, and can say it meant it'

      # The guards are a documented feature — "a config written in the wrong
      # shape warns and falls back instead of aborting the build" — and they were
      # never built against a wrong shape. Three raw reads had escaped them, two
      # of which took the build down.
      - name: Assert a malformed config warns instead of aborting
        run: |
          set -eo pipefail
          d=/tmp/aeo-badparams
          rm -rf "$d"; mkdir -p "$d/themes" "$d/content/posts" "$d/layouts/_default"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/t/"
          title = "Bad params"
          theme = "aeo-hugo"
          enableRobotsTXT = true
          [params]
            description = ["a", "b"]
          [params.aeo]
            allowAI = "false"
            allowTraining = "no"
            disallow = "/drafts/"
            postSections = [{ x = 1 }]
            publisher = "me"
          [outputs]
            home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
            page = ["HTML", "MARKDOWN"]
          TOML
          printf '<!DOCTYPE html><html><head>{{ partial "aeo-head.html" . }}</head><body><main>{{ block "main" . }}{{ end }}</main></body></html>' > "$d/layouts/_default/baseof.html"
          for f in index.html _default/single.html _default/list.html; do
            mkdir -p "$(dirname "$d/layouts/$f")"
            printf '{{ define "main" }}{{ .Content }}{{ end }}' > "$d/layouts/$f"
          done
          # Front matter in the wrong shape too: `tags` as a string and `image`
          # as a list each aborted the build from a different partial.
          printf -- '---\ntitle: "P"\ndate: 2026-01-01\ntags: "notalist"\nauthor: ["a","b"]\nimage: ["a.png","b.png"]\n---\nbody\n' > "$d/content/posts/p.md"
          HUGO_ENV=production hugo --source "$d" --gc --destination "$d/public" > "$d.log" 2>&1 \
            || { echo 'aeo: a malformed config aborted the build'; cat "$d.log"; exit 1; }
          fail=0
          for want in \
            '[params.aeo] allowAI must be true or false' \
            '[params.aeo] allowTraining must be true or false' \
            '[params.aeo] disallow must be a list' \
            '[params.aeo] postSections ignored 1 of its entries' \
            '[params.aeo.publisher] must be a table' \
            '[params.description] must be a single value' \
            'tags in /t/posts/p/ must be a list' \
            'image in /t/posts/p/ must be a single value' \
            'author in /t/posts/p/ must be a single value'
          do
            grep -qF "$want" "$d.log" || { echo "guards: nothing warned about: $want"; fail=1; }
          done
          # The quietest of them: `allowAI = "false"` is a non-empty string, so a
          # raw read makes the switch that means "off" turn the group on.
          grep -A2 '^User-agent: OAI-SearchBot' "$d/public/robots.txt" | grep -q 'Disallow: /$' \
            && { echo 'guards: allowAI = "false" was read as a truthy string'; fail=1; }
          [ "$fail" = 0 ] || { cat "$d.log"; exit 1; }
          # And the site still built something worth checking.
          python3 scripts/check_aeo.py "$d/public"
          echo 'aeo: every malformed param warned, fell back, and left a working build'

      # allowTraining = false is the switch people reach for first, and it had
      # never been built. check_aeo.py has carried --training-blocked for it from
      # the start with nothing passing it.
      - name: Assert allowTraining = false blocks the training crawlers
        env:
          HUGO_PARAMS_AEO_ALLOWTRAINING: "false"
        run: |
          set -eo pipefail
          hugo --source exampleSite --gc --minify --panicOnWarning \
            --baseURL "https://example.com/aeo-hugo/" --destination /tmp/aeo-notraining
          python3 scripts/check_aeo.py /tmp/aeo-notraining --training-blocked
          # …and the flag is not a way of asking for less: without it the same
          # build is a failure, which is what makes passing it a statement.
          if python3 scripts/check_aeo.py /tmp/aeo-notraining > /dev/null 2>&1; then
            echo 'aeo: a build with training blocked passed the check that says it is not'
            exit 1
          fi
          # The answer engines are untouched — that is the point of two switches.
          grep -A2 '^User-agent: OAI-SearchBot' /tmp/aeo-notraining/robots.txt | grep -q 'Disallow: /$' \
            && { echo 'aeo: allowTraining also shut off the answer engines'; exit 1; }
          echo 'aeo: allowTraining = false blocks the training crawlers and nothing else'

      # The flat sitemap is a published contract with every crawler that already
      # knows the site, and it is reachable only on a multilingual one — which is
      # why exampleSite is bilingual. Both branches of layouts/sitemapindex.xml
      # get built.
      - name: Assert the flat sitemap
        env:
          HUGO_PARAMS_AEO_FLATSITEMAP: "true"
        run: |
          set -eo pipefail
          hugo --source exampleSite --gc --minify --panicOnWarning \
            --baseURL "https://example.com/aeo-hugo/" --destination /tmp/aeo-flat
          python3 scripts/check_aeo.py /tmp/aeo-flat
          python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          NS = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          root = ET.parse('/tmp/aeo-flat/sitemap.xml').getroot()
          bad = []
          if root.tag != NS + 'urlset':
              bad.append('flatSitemap = true still published a <%s>'
                         % root.tag.replace(NS, ''))
          locs = [e.text for e in root.iter(NS + 'loc')]
          # The whole reason the flat option exists: one file a crawler that does
          # not follow an index can read as pages, carrying every language.
          for want in ('/aeo-hugo/posts/hello-answer-engines/',
                       '/aeo-hugo/pt/posts/hello-answer-engines/'):
              if not any(l.endswith(want) for l in locs):
                  bad.append('the flat sitemap does not list %s' % want)
          # …and it honours disallow, like every other file the module writes.
          for loc in locs:
              if '/drafts/' in loc:
                  bad.append('the flat sitemap lists %s, which robots.txt blocks' % loc)
          if bad:
              sys.exit('\n'.join('flat: ' + b for b in bad))
          print('flat: one <urlset>, %d urls, both languages, no disallowed path' % len(locs))
          PY

      # The multilingual guarantees the bilingual exampleSite exists to hold.
      # A single-language site never renders layouts/sitemapindex.xml at all, so
      # none of this was reachable before.
      - name: Assert the multilingual output
        run: |
          set -eo pipefail
          pub=exampleSite/public
          fail=0
          say() { echo "ml: $1"; fail=1; }
          # One llms.txt per language, each listing its own posts.
          grep -qF 'Olá, motores de resposta' "$pub/pt/llms.txt" || say 'pt/llms.txt does not list the Portuguese post'
          grep -qF 'Olá, motores de resposta' "$pub/llms.txt" && say 'the English llms.txt lists a Portuguese post'
          grep -qF 'Also published in pt-BR' "$pub/llms.txt" || say 'llms.txt does not name its translation'
          # disallow is one prefix covering every language, so robots.txt has to
          # write it once per language root — and rooted at the host, which is
          # what a Disallow line means and what the sub-path baseURL exposes.
          grep -qF 'Disallow: /aeo-hugo/drafts/' "$pub/robots.txt" || say 'robots.txt does not disallow /drafts/ at the site root'
          grep -qF 'Disallow: /aeo-hugo/pt/drafts/' "$pub/robots.txt" || say 'robots.txt does not disallow the translated /pt/drafts/'
          # …and nothing else names the excluded page or carries its body.
          for f in llms.txt pt/llms.txt llms-full.txt pt/llms-full.txt sitemap.xml en/sitemap.xml pt/sitemap.xml; do
            grep -qF 'drafts' "$pub/$f" && say "$f names a path robots.txt disallows"
          done
          grep -qF 'DRAFTBODY' "$pub/drafts/not-ready-yet/index.md" && say 'the twin of a disallowed page carries its body'
          grep -qF 'DRAFTBODY' "$pub/pt/drafts/not-ready-yet/index.md" && say 'the translated twin carries its body'
          # hreflang: the head and the sitemap describe one set of alternates, so
          # they have to spell it one way. Locale, not Lang.
          # Quotes are optional: --minify strips them, so every attribute match
          # here allows for both spellings. The bare-language pattern needs the
          # closing boundary or it matches inside pt-BR and reports the fix as
          # the bug.
          page="$pub/posts/hello-answer-engines/index.html"
          grep -qE 'hreflang="?pt-BR"?' "$page" || say 'the head writes no pt-BR alternate'
          grep -qE 'hreflang="?x-default"?' "$page" || say 'the head writes no x-default'
          grep -qE 'hreflang="?pt("|[[:space:]]|>)' "$page" && say 'the head still writes a bare language hreflang'
          [ "$fail" = 0 ] || exit 1
          echo 'ml: two languages, one disallow list, one hreflang spelling'

      # Both sitemap templates *replace* a Hugo built-in, so neither can fall
      # through to it — each has to reproduce it, and the only thing keeping
      # them faithful is a diff against the real thing. Worth building: this is
      # the check that caught layouts/sitemap.xml emitting `</url>\n  <url>`
      # where Hugo emits `</url><url>`, which is invisible under --minify and
      # was the one file that moved when a real theme migrated onto this module.
      #
      # Only against the version the templates are written to reproduce. Hugo's
      # own embedded sitemap.xml changed between the two in the matrix: 0.158
      # ranges over .Translations and emits a separate self-link outside the
      # range, 0.163 ranges over .AllTranslations, which already includes the
      # self. Those are different documents, layouts/sitemapindex.xml says in as
      # many words that it copies the 0.163 form on purpose, and comparing
      # against 0.158's built-in would report that decision as a regression on
      # every run. The 0.158 leg of the matrix still builds all of this — it
      # just does not diff it against a template that has since changed.
      - name: Assert the sitemap overrides reproduce Hugo's built-ins
        if: matrix.hugo-version == '0.163.3'
        run: |
          set -eo pipefail
          d=/tmp/aeo-fidelity
          rm -rf "$d"; mkdir -p "$d/themes" "$d/content.en/posts" "$d/content.pt/posts" "$d/layouts/_default"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
          # No [params.aeo] disallow anywhere: the override filters excluded
          # pages and the built-in does not, so a fixture with one is comparing
          # two files that are *supposed* to differ.
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/f/"
          title = "Fidelity"
          theme = "aeo-hugo"
          defaultContentLanguage = "en"
          [languages]
            [languages.en]
              weight = 1
              locale = "en-US"
            [languages.pt]
              weight = 2
              locale = "pt-BR"
          TOML
          printf '<!DOCTYPE html><html><head>{{ partial "aeo-head.html" . }}</head><body>{{ block "main" . }}{{ end }}</body></html>' > "$d/layouts/_default/baseof.html"
          for f in index.html _default/single.html _default/list.html; do
            mkdir -p "$(dirname "$d/layouts/$f")"
            printf '{{ define "main" }}{{ end }}' > "$d/layouts/$f"
          done
          printf -- '---\ntitle: "P"\ndate: 2026-01-01\ntags: ["t"]\n---\nb\n' > "$d/content.en/posts/p.md"
          printf -- '---\ntitle: "P pt"\ndate: 2026-01-01\ntags: ["t"]\n---\nb\n' > "$d/content.pt/posts/p.md"
          # --minify on both sides. The assertion is that the override emits the
          # same *document* as the built-in — every <loc>, every <lastmod>, every
          # alternate — not that it is indented the same way. sitemapindex.xml
          # has always been written two-space where Hugo's embedded template
          # uses tabs and blank lines, deliberately and readably, and a byte
          # comparison would report that as a regression forever.
          HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning --destination "$d/ours" > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }

          # The same module minus the two templates: what Hugo emits on its own.
          bare=/tmp/aeo-fidelity-bare
          rm -rf "$bare"; mkdir -p "$bare"
          for f in layouts hugo.toml theme.toml go.mod; do cp -r "$GITHUB_WORKSPACE/$f" "$bare/"; done
          rm -f "$bare/layouts/sitemap.xml" "$bare/layouts/sitemapindex.xml"
          ln -sfn "$bare" "$d/themes/aeo-hugo"
          HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning --destination "$d/hugos" > "$d.bare.log" 2>&1 || { cat "$d.bare.log"; exit 1; }
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"

          fail=0
          for f in sitemap.xml en/sitemap.xml pt/sitemap.xml; do
            if [ ! -f "$d/hugos/$f" ]; then
              echo "fidelity: Hugo published no $f on its own — the fixture is wrong"
              fail=1; continue
            fi
            if ! cmp -s "$d/ours/$f" "$d/hugos/$f"; then
              echo "fidelity: $f no longer reproduces Hugo's built-in"
              diff "$d/hugos/$f" "$d/ours/$f" | head -20 || true
              fail=1
            fi
          done
          # And one file where the bar *is* byte-exactness, unminified.
          # layouts/sitemap.xml is the per-language <urlset> a site already
          # publishes, so a theme adopting this module should be able to diff its
          # own output and see nothing move — and that is exactly what did move
          # when terminal-mono migrated, over `</url><url>` versus a newline.
          HUGO_ENV=production hugo --source "$d" --gc --panicOnWarning --destination "$d/raw-ours" > /dev/null 2>&1
          ln -sfn "$bare" "$d/themes/aeo-hugo"
          HUGO_ENV=production hugo --source "$d" --gc --panicOnWarning --destination "$d/raw-hugos" > /dev/null 2>&1
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/aeo-hugo"
          for f in en/sitemap.xml pt/sitemap.xml; do
            if ! cmp -s "$d/raw-ours/$f" "$d/raw-hugos/$f"; then
              echo "fidelity: $f differs from Hugo's built-in before minification"
              diff "$d/raw-hugos/$f" "$d/raw-ours/$f" | head -12 || true
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "fidelity: both sitemap overrides emit Hugo's own document, and sitemap.xml matches it byte for byte"
